<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio Sesión - GDTG</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<main class="login-page">

    <section class="login-card">

        <div class="logo">
            🛠
        </div>

        <h1>Inicio Sesión en GDTG</h1>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="usuario">Usuario o email</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <p class="error" th:if="${error}" th:text="${error}"></p>

            <button type="submit">Iniciar Sesión</button>
        </form>

        <p class="ayuda">
            ¿Nuevo en GDTG?
            <a href="#">contacte con un administrador<br>para obtener sus credenciales</a>
        </p>

    </section>

</main>

<footer>
    <span>Términos y servicios</span>
    <span>Privacidad</span>
    <span>Documentos</span>
    <span>Contacto de soporte</span>
    <span>Manejar cookies</span>
    <span>No mostrar mi información personal</span>
</footer>

</body>
</html>
