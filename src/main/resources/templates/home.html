<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear incidencia</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div class="layout">

    <header class="topbar">
        <a th:href="@{/home}" class="logo">🛠</a>

        <nav class="menu">
            <a href="#" class="active">Crear incidencia</a>
            <a th:href="@{/mis-incidencias}">Estado de mis incidencias</a>
        </nav>

		<details class="usuario-menu">

		    <summary class="usuario-nombre"
		             th:text="${nombreUsuario}">
		        Usuario
		    </summary>

		    <div class="dropdown">
		        <a th:href="@{/logout}">
		            Cerrar sesión
		        </a>
		    </div>

		</details>
    </header>

    <main class="contenido">

        <form class="formulario"
              th:action="@{/home/incidencia}"
              th:object="${incidencia}"
              method="post">

            <label>Tipo de incidencia</label>
            <input type="text" th:field="*{titulo}" placeholder="Selecciona el tipo de incidencia">

            <label>Ubicación</label>
			<select th:field="*{aulaId}" required>
			    <option value="">Selecciona un aula</option>

			    <option th:each="aula : ${aulas}"
			            th:value="${aula.id}"
			            th:text="|${aula.codigo} - ${aula.descripcion}|">
			        Aula
			    </option>
			</select>

            <label>Descripción</label>
            <textarea th:field="*{descripcion}" placeholder="Describe la incidencia con el mayor detalle posible..."></textarea>

            <div class="imagen-box">
                <div class="camara">📷</div>
                <p>Arrastre o seleccione una imagen</p>
            </div>
			

			<p class="error" th:if="${error}" th:text="${error}"></p>

            <button type="submit">Enviar incidencia</button>

        </form>

    </main>

    <footer>
        <span>Términos y servicios</span>
        <span>Privacidad</span>
        <span>Documentos</span>
        <span>Contacto de soporte</span>
        <span>Manejar cookies</span>
    </footer>

</div>

</body>
</html>
