	<!DOCTYPE html>
	<html lang="es" xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <title>Detalle usuario</title>
	    <link rel="stylesheet" th:href="@{/css/admin-detalle.css}">
	</head>
	<body>
	
	<div class="layout">
	
	    <header class="topbar">
	        <a th:href="@{/admin/home}" class="logo">🛠</a>
	
	        <nav class="menu">
	            <a th:href="@{/admin/usuarios/nuevo}">Crear usuario</a>
	            <a th:href="@{/admin/usuarios}" class="active">Gestionar usuarios</a>
	        </nav>
	
			<details class="usuario-menu">

			    <summary class="usuario-nombre"
			             th:text="${nombreUsuario}">
			        Usuario
			    </summary>

			    <div class="dropdown">
			        <a th:href="@{/logout}">
			            Cerrar sesión
			        </a>
			    </div>

			</details>
	    </header>
	
	    <main class="contenido">
	
	        <section class="detalle-card">
	
	            <a class="volver" th:href="@{/admin/usuarios}">
	                ← 
	            </a>
	
	            <h1 th:text="${usuario.username}">
	                Usuario
	            </h1>
	
	            <div class="info">
	
	                <div class="campo">
	                    <label>Username</label>
	                    <p th:text="${usuario.username}">oscar</p>
	                </div>
	
	                <div class="campo">
	                    <label>Nombre</label>
	                    <p th:text="${usuario.nombre}">Oscar Coronado</p>
	                </div>
	
	                <div class="campo">
	                    <label>Email</label>
	                    <p th:text="${usuario.email}">oscar@centro.com</p>
	                </div>
	
	                <div class="campo doble">
	                    <div>
	                        <label>Rol</label>
	                        <p th:text="${usuario.rol}">USER</p>
	                    </div>
	
	                    <div>
	                        <label>Activo</label>
	                        <p th:text="${usuario.activo ? 'Sí' : 'No'}">Sí</p>
	                    </div>
	                </div>
	
	            </div>
				
				<div class="incidencias-aula">

				    <h2>Incidencias enviadas por este usuario</h2>

				    <table>
				        <thead>
				            <tr>
				                <th>Título</th>
				                <th>Aula</th>
				                <th>Fecha creación</th>
				                <th>Estado</th>
				            </tr>
				        </thead>

				        <tbody>
				            <tr th:each="incidencia : ${incidencias}"
				                th:onclick="|window.location.href='@{/admin/incidencias/{id}(id=${incidencia.id})}'|"
				                class="fila-click">

				                <td th:text="${incidencia.titulo}">Proyector roto</td>
				                <td th:text="${incidencia.aulaCodigo}">A-101</td>

				                <td th:text="${#temporals.format(incidencia.fechaCreacion, 'dd/MM/yyyy')}">
				                    01/06/2026
				                </td>

				                <td th:text="${incidencia.estadoNombre}">
				                    PENDIENTE
				                </td>
				            </tr>
				        </tbody>
				    </table>

				    <p class="sin-datos" th:if="${#lists.isEmpty(incidencias)}">
				        Este usuario todavía no ha enviado incidencias.
				    </p>

				</div>
				
	
	            <div class="acciones">
	
	                <a class="btn editar"
	                   th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}">
	                    Editar usuario
	                </a>
	
	                <form th:action="@{/admin/usuarios/{id}/eliminar(id=${usuario.id})}"
	                      method="post"
	                      onsubmit="return confirm('¿Seguro que quieres eliminar este usuario?');">
	
	                    <button type="submit" class="btn eliminar">
	                        Eliminar usuario
	                    </button>
	
	                </form>
	
	            </div>
	
	        </section>
	
	    </main>
	
	</div>
	
	</body>
	</html>
