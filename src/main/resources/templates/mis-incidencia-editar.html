<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar incidencia</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div class="layout">

    <header class="topbar">
        <div class="logo">🛠</div>

        <nav class="menu">
            <a th:href="@{/home}">Crear incidencia</a>
            <a th:href="@{/mis-incidencias}" class="active">Estado de mis incidencias</a>
        </nav>

		<div class="usuario-menu">

		    <span class="usuario-nombre"
		          th:text="${nombreUsuario}">
		        Usuario
		    </span>

		    <div class="dropdown">
		        <a th:href="@{/logout}">
		            Cerrar sesión
		        </a>
		    </div>

		</div>
    </header>

    <main class="contenido">

        <form class="formulario"
              th:action="@{/mis-incidencias/{id}/editar(id=${incidencia.id})}"
              th:object="${incidencia}"
              method="post">

            <h1>Editar incidencia</h1>

            <label>Tipo de incidencia</label>
            <input type="text"
                   th:field="*{titulo}"
                   placeholder="Selecciona el tipo de incidencia"
                   required>

            <label>Ubicación</label>
            <input type="number"
                   th:field="*{aulaId}"
                   placeholder="Introduce el ID del aula"
                   required>

            <label>Descripción</label>
            <textarea th:field="*{descripcion}"
                      placeholder="Describe la incidencia con el mayor detalle posible..."
                      required></textarea>

            <div class="imagen-box">
                <div class="camara">📷</div>
                <p>Imagen no editable de momento</p>
            </div>

            <p class="error" th:if="${error}" th:text="${error}"></p>

            <button type="submit">Guardar cambios</button>

        </form>

    </main>

    <footer>
        <span>Términos y servicios</span>
        <span>Privacidad</span>
        <span>Documentos</span>
        <span>Contacto de soporte</span>
        <span>Manejar cookies</span>
    </footer>

</div>

</body>
</html>
